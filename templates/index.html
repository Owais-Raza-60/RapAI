<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RapAI</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <main class="app">

        <!-- Welcome Screen -->
        <section class="welcome">

            <h1>
                Welcome to <span>RapAI</span>
            </h1>

            <p>
                Your AI rapper for quick answers, ideas and conversations.
            </p>

        </section>


        <!-- Chat Area -->
        <section class="chat-container">

            <div id="chatBox" class="chat-box">

                <!-- Messages will appear here -->

            </div>

        </section>


        <!-- Input Area -->
        <section class="input-section">

            <div class="input-box">

                <textarea
                    id="messageInput"
                    placeholder="Ask RapAI anything..."
                    rows="1"
                ></textarea>

                <button id="sendButton">
                    ↑
                </button>

            </div>

            <p class="disclaimer">
                RapAI is Rapper & Roster. Ask me something and I'll disrespect you
            </p>

        </section>

    </main>


    <script src="{{ url_for('static', filename='script.js') }}"></script>
    
    <footer style="text-align: center; padding: 20px; font-size: 14px; color: #040404;"> Developed by 
    <span style="color: #1623d5;font-weight: 600;letter-spacing: 0.5px;">OS-Raza</span> ⚡
</footer>

</body>

</html>
